name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Supersede in-flight runs on PR force-push/amend only; pushes to main are never
# cancelled — each merge's run is the post-merge safety net and must complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A secret can be committed to any file, so this is never gated on a path filter. It is
  # skipped on pushes to main only because the PR run already scanned the same history.
  secrets:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Runs the gitleaks binary directly rather than gitleaks-action, which requires a
      # paid licence key for organisation-owned repos. Pinned; Dependabot does not track
      # this download, so bump the version here when a new gitleaks release lands.
      - name: Scan history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --verbose

  # Builds and tests the solution. Core must keep standing on its own — the property the
  # split exists to protect — so this build never has a product to fall back on.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Restore
        run: dotnet restore Nordstein.Core.sln --nologo

      # Warnings are errors (Directory.Build.props sets TreatWarningsAsErrors), so a new
      # warning fails here rather than accumulating unread.
      - name: Build
        run: dotnet build Nordstein.Core.sln --nologo --no-restore

      # One run of the full suite, collecting coverage of every shipped assembly (tools/coverage.runsettings).
      # The PostgreSQL-backed tests start a container; without this flag a missing runtime would
      # skip them and the coverage of two shipped packages would be lost silently.
      - name: Test with coverage
        env:
          NORDSTEIN_CORE_REQUIRE_DOCKER_TESTS: "1"
        run: >-
          dotnet test Nordstein.Core.sln --nologo --verbosity minimal --no-restore --no-build
          --settings tools/coverage.runsettings --collect "XPlat Code Coverage"
          --results-directory artifacts/coverage

      # Every shipped assembly at or above its floor in tools/coverage-floors.json (90 % line and branch). Never green
      # on a missing result: no report, an unreadable one, an assembly without a floor or a floor without coverage fail.
      - name: Coverage gate
        run: python3 tools/coverage_gate.py --reports artifacts/coverage --floors tools/coverage-floors.json

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: artifacts/coverage
          if-no-files-found: warn
          retention-days: 7

  # The repository's own tooling (tools/, .claude/hooks/): its Python unit tests, standard library only. Never gated
  # on a path filter: a skipped required check counts as passing.
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tooling tests
        run: python3 -m unittest discover --start-directory tools/tests --verbose

      # Every relative Markdown link resolves and every docs/ page has its CLAUDE.md index row.
      - name: Docs check
        run: python3 tools/docs_check.py --root .

  # Lints every workflow, the shell in `run:` steps included (shellcheck ships with the runner image).
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A pinned binary, not an action; Dependabot does not track this download, so bump the version here.
      - name: Lint workflows
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint -color

  # Packs the NuGet packages and uploads them. Everyday builds resolve project references,
  # which hide two things a package consumer would hit: a type that is public in source but
  # never made it onto the package's surface, and a missing pack input (LICENSE, README,
  # symbols). Packing on every run keeps those from being discovered only at publish time.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj

      # A CI prerelease version, so a hand- or CI-built package can never be mistaken for a
      # published one. Nothing is pushed anywhere — see PUBLISHING.md; publishing is gated on
      # decisions (feed, licence, package-ID prefix) that are not settled yet.
      - name: Pack
        run: >-
          dotnet pack Nordstein.Core.sln --nologo -c Release
          -p:NordsteinCoreVersion=0.1.0-ci.${{ github.run_number }}
          -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nordstein-core-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7
