name: CodeQL

# Static analysis via GitHub code scanning. Findings appear in the repo's Security tab;
# a PR fails its check when it introduces a new alert.
#
# Two languages, both analysed with build-mode `none` (no compilation), so this stays
# fast: C# (the library) and Actions (the workflows themselves). The matrix is fixed
# rather than diff-driven — the repository is a single solution, so there is no meaningful
# subset to trim to, and a fixed matrix keeps the Security tab's baseline from drifting.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly re-scan so new CodeQL query releases surface findings without waiting
    # for the next commit.
    - cron: "17 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language:
          - csharp
          - actions

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
